[package]
name = "htoh-core"
version = "10.0.0"
edition = "2021"
description = "Business logic core for HandToHand X: SQLite (WAL) persistence, fixed-point money, tally, SMR aggregation, audit trail, backups and raw printing"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi"] }

[dev-dependencies]
tempfile = "3"
