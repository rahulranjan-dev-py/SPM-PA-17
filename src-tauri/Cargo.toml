[workspace]
members = [".", "crates/htoh-core"]

[package]
name = "handtohand-desktop"
version = "10.0.0"
description = "HandToHand X — offline-first Sub Office hand-to-hand register, cash tally and SMR (PA-17) batch engine"
authors = ["SPM-PA-17 contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "handtohand_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
htoh-core = { path = "crates/htoh-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
