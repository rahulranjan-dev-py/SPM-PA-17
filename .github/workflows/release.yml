name: Release

# Builds the desktop installers on GitHub runners and publishes them to a
# GitHub Release, then bundles every asset into one zip with an install guide,
# adds SHA-256 checksums and writes the release notes. Trigger by pushing a tag
# `vX.Y.Z`, or manually with a tag name (untick "rebuild" to only refresh the
# zip, checksums and notes of an existing release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v10.0.0); created if it does not exist"
        required: true
        type: string
      rebuild:
        description: "Rebuild the installers (uncheck to only refresh the bundle zip, checksums and release notes)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows (NSIS + MSI, x64)
            args: ""
          - platform: ubuntu-22.04
            label: Linux (deb, rpm, AppImage)
            args: ""
          - platform: macos-latest
            label: macOS (Apple Silicon)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf pkg-config build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "HandToHand X ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            HandToHand X — offline-first Sub Office hand-to-hand cash register, chest tally and SMR (PA-17) batch engine. Replaces "HandToHand V9.1 with SMR for all SO".

            **Installers**
            - Windows 10/11: `.exe` (NSIS, recommended) or `.msi`. WebView2 is bootstrapped by the installer if missing.
            - Linux: `.deb`, `.rpm` or `.AppImage`.
            - macOS: `.dmg` (unsigned; right-click → Open on first launch).

            **First run:** sign in as `spm` with PIN `1234`; the app requires a PIN change before use. Add Sub Offices and operators under *Offices & Settings*.

            **Highlights**
            - Voucher ledger per counter (Savings Bank, Mails & Parcels, Remittances, PLI/RPLI) with SAP reference, barcode IDs and Pending / Accepted / Rejected verification
            - Live denomination dock (₹500 … ₹1, mixed coins, cash items) with Balanced / Surplus / Deficit comparator against the Finacle / SAP figure
            - `F2` calculator, `F3` voucher, `F5` recalculate, `F9` tally, `F10` closing sheet; global USB barcode-wedge detection with UPU S10 validation
            - SMR Hub: one-click PA-17 compilation for every Sub Office, cash-limit violation log, stamp & stationery stock, SPM sign-off, PDF / Excel / CSV export
            - SQLite in WAL mode, verified snapshot backups on every close, restore with safety copy, immutable audit trail, operator vs supervisor tiers
            - ESC/POS and plain-text RAW printing to slip / dot-matrix printers; native A4 print and vector PDF
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Bundle zip, checksums and release notes
    needs: build
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the installers from the release
        run: |
          mkdir -p bundle
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir bundle
          rm -f bundle/*.zip bundle/SHA256SUMS.txt bundle/INSTALL.md
          ls -l bundle

      - name: Render the install guide and release notes
        run: |
          VERSION="${TAG#v}"
          sed -e "s/{{TAG}}/$TAG/g" -e "s/{{VERSION}}/$VERSION/g" .github/release/INSTALL.md > INSTALL.md
          cp INSTALL.md bundle/INSTALL.md
          {
            echo "Download **one** file for your platform, or the all-platforms zip for offline distribution. Full guide: \`INSTALL.md\` (also inside the zip)."
            echo
            cat INSTALL.md
          } > notes.md

      - name: Create the all-platforms zip and checksums
        run: |
          ZIP="HandToHand-X-$TAG-all-platforms.zip"
          (cd bundle && zip -r -9 "../$ZIP" .)
          { sha256sum "$ZIP"; (cd bundle && sha256sum *); } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload bundle, checksums and guide; update the release notes
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "HandToHand-X-$TAG-all-platforms.zip" SHA256SUMS.txt INSTALL.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "HandToHand X $TAG" --notes-file notes.md
